# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
    permissions:
      contents: read
    with:
      setup: true
      submodules: true
      hosted-runner: ubuntu-26.04
      python-version: 3.15.2
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
      rust-targets: wasm32-unknown-unknown
      tools: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-shear@1.14.0
      tool-assets: .github/ci-tools.json
