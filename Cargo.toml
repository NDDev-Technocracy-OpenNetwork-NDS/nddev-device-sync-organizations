[package]
name = "nddev-device-sync-organizations"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-organizations"

[features]
development-http = ["nddev-device-sync-accounts/development-http"]

[dependencies]
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "bcf1f2d70b29d8f6e66746b33de63f0b1e6b7118" }
nddev-device-sync-domain = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "8304a251f903b89b7169c8fb2d12a8ffd7666124" }
serde_json = "1"
serde = "1"
time = "0.3"
uuid = { version = "1.27", features = ["v7"] }
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "c63a39da62b7b1b083149f2da5c9205f125e2190" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.27", features = ["js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
