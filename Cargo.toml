[package]
name = "nddev-device-sync-organizations"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-organizations"

[features]
browser-bindings = ["dep:tsify", "dep:wasm-bindgen"]
development-http = ["nddev-device-sync-accounts/development-http"]

[dependencies]
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "6f6c551cd6026aac33840d139ac1e51e6e0b89a2" }
nddev-device-sync-domain = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "0135c86b2887c7cea96c0f1082d70560bde00cc6" }
serde_json = "1"
serde = "1"
time = "0.3"
uuid = { version = "1.27", features = ["v7"] }
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "2526e5f7a6926e5bb8957dfb7edcb63209fa1ca4" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
tsify = { version = "=0.5.8", default-features = false, features = ["js"], optional = true }
uuid = { version = "1.27", features = ["js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
